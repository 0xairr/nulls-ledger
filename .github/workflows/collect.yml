name: collect
# Refresh ledger.json from public X data; commit only when it changed. Asks for every 10 minutes,
# off the top of the hour (GitHub's busiest time), but GitHub delays scheduled runs on small repos:
# the first 11 hours got 2 runs, 6h apart. Nothing is lost when a run is late; it just catches up.
on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - run: python3 test_collect.py
      - run: python3 collect.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- ledger.json; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger.json
          git commit -m "ledger: update"
          git pull --rebase --autostash
          git push
