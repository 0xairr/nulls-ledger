name: collect
# Refresh ledger.json from public X data about every 10 minutes; commit only when it changed.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - run: python3 test_collect.py
      - run: python3 collect.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- ledger.json; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger.json
          git commit -m "ledger: update"
          git pull --rebase --autostash
          git push
